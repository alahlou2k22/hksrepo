apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: calicoctl
rules:
- verbs:
  - get
  - list
  - update
  apiGroups:
  - ''
  resources:
  - namespaces
  - nodes
- verbs:
  - update
  apiGroups:
  - ''
  resources:
  - nodes/status
- verbs:
  - get
  - list
  apiGroups:
  - ''
  resources:
  - pods
  - serviceaccounts
- verbs:
  - update
  apiGroups:
  - ''
  resources:
  - pods/status
- verbs:
  - create
  - get
  - list
  - update
  - delete
  apiGroups:
  - crd.projectcalico.org
  resources:
  - bgppeers
  - bgpconfigurations
  - clusterinformations
  - felixconfigurations
  - globalnetworkpolicies
  - globalnetworksets
  - ippools
  - ipreservations
  - kubecontrollersconfigurations
  - networkpolicies
  - networksets
  - hostendpoints
  - ipamblocks
  - blockaffinities
  - ipamhandles
  - ipamconfigs
- verbs:
  - get
  - list
  apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
