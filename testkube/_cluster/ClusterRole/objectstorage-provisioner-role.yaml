apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: objectstorage-provisioner-role
  labels:
    app.kubernetes.io/component: driver-ceph
    app.kubernetes.io/name: cosi-driver-ceph
    app.kubernetes.io/part-of: container-object-storage-interface
rules:
- verbs:
  - get
  - list
  - watch
  - update
  - create
  - delete
  apiGroups:
  - objectstorage.k8s.io
  resources:
  - buckets
  - bucketaccesses
  - bucketclaims
  - bucketaccessclasses
  - buckets/status
  - bucketaccesses/status
  - bucketclaims/status
  - bucketaccessclasses/status
- verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
  apiGroups:
  - coordination.k8s.io
  resources:
  - leases
- verbs:
  - get
  - delete
  - update
  - create
  apiGroups:
  - ''
  resources:
  - secrets
  - events
- verbs:
  - create
  - patch
  - update
  apiGroups:
  - events.k8s.io
  resources:
  - events
