apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
rules:
- verbs:
  - delete
  - get
  - patch
  apiGroups:
  - '*'
  resources:
  - '*'
- verbs:
  - list
  apiGroups:
  - ''
  resources:
  - events
- verbs:
  - get
  apiGroups:
  - ''
  resources:
  - pods
  - pods/log
- verbs:
  - get
  - list
  - watch
  apiGroups:
  - argoproj.io
  resources:
  - applications
  - applicationsets
- verbs:
  - create
  apiGroups:
  - batch
  resources:
  - jobs
- verbs:
  - create
  apiGroups:
  - argoproj.io
  resources:
  - workflows
