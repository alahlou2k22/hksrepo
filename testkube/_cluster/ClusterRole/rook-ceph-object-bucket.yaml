apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-object-bucket
  labels:
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/part-of: rook-ceph-operator
    operator: rook
    storage-backend: ceph
rules:
- verbs:
  - get
  - create
  - update
  - delete
  apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
- verbs:
  - get
  apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
- verbs:
  - list
  - watch
  - get
  - update
  apiGroups:
  - objectbucket.io
  resources:
  - objectbucketclaims
- verbs:
  - list
  - watch
  - get
  - create
  - update
  - delete
  apiGroups:
  - objectbucket.io
  resources:
  - objectbuckets
- verbs:
  - update
  apiGroups:
  - objectbucket.io
  resources:
  - objectbucketclaims/status
  - objectbuckets/status
- verbs:
  - update
  apiGroups:
  - objectbucket.io
  resources:
  - objectbucketclaims/finalizers
  - objectbuckets/finalizers
