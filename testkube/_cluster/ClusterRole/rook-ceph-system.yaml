  resources:
  - pods
  - pods/log
- verbs:
  - create
  apiGroups:
  - ''
  resources:
  - pods/exec
- verbs:
  - create
  - get
  - update
  - delete
  - watch
  - list
  - deletecollection
  apiGroups:
  - csiaddons.openshift.io
  resources:
  - networkfences
- verbs:
  - get
  apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
- verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
  apiGroups:
  - csi.ceph.io
  resources:
  - cephconnections
- verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
  apiGroups:
  - csi.ceph.io
  resources:
  - clientprofiles
- verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
  apiGroups:
  - csi.ceph.io
  resources:
  - operatorconfigs
- verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
  apiGroups:
  - csi.ceph.io
  resources:
  - drivers
