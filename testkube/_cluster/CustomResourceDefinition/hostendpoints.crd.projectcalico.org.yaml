apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hostendpoints.crd.projectcalico.org
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
spec:
  group: crd.projectcalico.org
  names:
    plural: hostendpoints
    singular: hostendpoint
    kind: HostEndpoint
    listKind: HostEndpointList
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              expectedIPs:
                type: array
                items:
                  type: string
              interfaceName:
                type: string
              node:
                type: string
              ports:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - port
                  - protocol
                  properties:
                    name:
                      type: string
                    port:
                      type: integer
                    protocol:
                      pattern: ^.*
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
              profiles:
                type: array
                items:
                  type: string
  conversion:
    strategy: None
