apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipamblocks.crd.projectcalico.org
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
spec:
  group: crd.projectcalico.org
  names:
    plural: ipamblocks
    singular: ipamblock
    kind: IPAMBlock
    listKind: IPAMBlockList
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - allocations
            - attributes
            - cidr
            - strictAffinity
            - unallocated
            properties:
              affinity:
                type: string
              allocations:
                type: array
                items:
                  type: integer
                  nullable: true
              attributes:
                type: array
                items:
                  type: object
                  properties:
                    handle_id:
                      type: string
                    secondary:
                      type: object
                      additionalProperties:
                        type: string
              cidr:
                type: string
              deleted:
                type: boolean
              sequenceNumber:
                type: integer
                format: int64
                default: 0
              sequenceNumberForAllocation:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
              strictAffinity:
                type: boolean
              unallocated:
                type: array
                items:
                  type: integer
  conversion:
    strategy: None
