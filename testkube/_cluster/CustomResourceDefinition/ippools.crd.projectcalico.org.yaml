                - Automatic
                - Manual
              blockSize:
                type: integer
              cidr:
                type: string
              disableBGPExport:
                type: boolean
              disabled:
                type: boolean
              ipip:
                type: object
                properties:
                  enabled:
                    type: boolean
                  mode:
                    type: string
              ipipMode:
                type: string
              namespaceSelector:
                type: string
              nat-outgoing:
                type: boolean
              natOutgoing:
                type: boolean
              nodeSelector:
                type: string
              vxlanMode:
                type: string
  conversion:
    strategy: None
