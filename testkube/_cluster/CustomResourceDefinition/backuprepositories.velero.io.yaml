apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuprepositories.velero.io
  labels:
    component: velero
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
spec:
  group: velero.io
  names:
    plural: backuprepositories
    singular: backuprepository
    kind: BackupRepository
    listKind: BackupRepositoryList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupRepositorySpec is the specification for a BackupRepository.
            type: object
            required:
            - backupStorageLocation
            - maintenanceFrequency
            - volumeNamespace
            properties:
              backupStorageLocation:
                description: |-
                  BackupStorageLocation is the name of the BackupStorageLocation
                  that should contain this repository.
                type: string
              maintenanceFrequency:
                description: MaintenanceFrequency is how often maintenance should be run.
                type: string
              repositoryConfig:
                description: RepositoryConfig is for repository-specific configuration fields.
                type: object
                additionalProperties:
                  type: string
                nullable: true
              repositoryType:
                description: RepositoryType indicates the type of the backend repository
                type: string
                enum:
                - kopia
                - restic
                - ''
              resticIdentifier:
                description: |-
                  ResticIdentifier is the full restic-compatible string for identifying
                  this repository. This field is only used when RepositoryType is "restic".
                type: string
              volumeNamespace:
                description: |-
                  VolumeNamespace is the namespace this backup repository contains
                  pod volume backups for.
                type: string
          status:
            description: BackupRepositoryStatus is the current status of a BackupRepository.
            type: object
            properties:
              lastMaintenanceTime:
                description: LastMaintenanceTime is the last time repo maintenance succeeded.
                type: string
                format: date-time
                nullable: true
              message:
                description: Message is a message about the current status of the BackupRepository.
                type: string
              phase:
                description: Phase is the current state of the BackupRepository.
                type: string
                enum:
                - New
                - Ready
                - NotReady
              recentMaintenance:
                description: RecentMaintenance is status of the recent repo maintenance.
                type: array
                items:
                  type: object
                  properties:
                    completeTimestamp:
                      description: CompleteTimestamp is the completion time of the repo maintenance.
                      type: string
                      format: date-time
                      nullable: true
                    message:
                      description: Message is a message about the current status of the repo maintenance.
                      type: string
                    result:
                      description: Result is the result of the repo maintenance.
                      type: string
                      enum:
                      - Succeeded
                      - Failed
                    startTimestamp:
                      description: StartTimestamp is the start time of the repo maintenance.
                      type: string
                      format: date-time
                      nullable: true
    subresources: {}
    additionalPrinterColumns:
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    - name: Repository Type
      type: string
      jsonPath: .spec.repositoryType
  conversion:
    strategy: None
