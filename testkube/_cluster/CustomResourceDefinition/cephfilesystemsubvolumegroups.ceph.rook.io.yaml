apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cephfilesystemsubvolumegroups.ceph.rook.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
spec:
  group: ceph.rook.io
  names:
    plural: cephfilesystemsubvolumegroups
    singular: cephfilesystemsubvolumegroup
    shortNames:
    - cephfssvg
    - cephsvg
    kind: CephFilesystemSubVolumeGroup
    listKind: CephFilesystemSubVolumeGroupList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: CephFilesystemSubVolumeGroup represents a Ceph Filesystem SubVolumeGroup
        type: object
        required:
        - metadata
        - spec
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec represents the specification of a Ceph Filesystem SubVolumeGroup
            type: object
            required:
            - filesystemName
            properties:
              clusterID:
                description: |-
                  ClusterID to be used for this subvolume group in the CSI configuration.
                  It must be unique among all Ceph clusters managed by Rook.
                  If not specified, the clusterID will be generated and can be found in the CR status.
                type: string
                maxLength: 36
                minLength: 1
                pattern: ^[a-zA-Z0-9_-]+$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: ClusterID is immutable
              dataPoolName:
                description: The data pool name for the Ceph Filesystem subvolume group layout, if the default CephFS pool is not desired.
                type: string
              filesystemName:
                description: |-
                  FilesystemName is the name of Ceph Filesystem SubVolumeGroup volume name. Typically it's the name of
                  the CephFilesystem CR. If not coming from the CephFilesystem CR, it can be retrieved from the
                  list of Ceph Filesystem volumes with `ceph fs volume ls`. To learn more about Ceph Filesystem
                  abstractions see https://docs.ceph.com/en/latest/cephfs/fs-volumes/#fs-volumes-and-subvolumes
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: filesystemName is immutable
              name:
                description: The name of the subvolume group. If not set, the default is the name of the subvolumeGroup CR.
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name is immutable
              pinning:
                description: |-
                  Pinning configuration of CephFilesystemSubVolumeGroup,
                  reference https://docs.ceph.com/en/latest/cephfs/fs-volumes/#pinning-subvolumes-and-subvolume-groups
                  only one out of (export, distributed, random) can be set at a time
                type: object
                properties:
                  distributed:
                    type: integer
                    maximum: 1
                    minimum: 0
                    nullable: true
                  export:
                    type: integer
                    maximum: 256
                    minimum: -1
                    nullable: true
                  random:
                    type: number
                    maximum: 1
                    minimum: 0
                    nullable: true
                x-kubernetes-validations:
                - rule: (has(self.export) && !has(self.distributed) && !has(self.random)) || (!has(self.export) && has(self.distributed) && !has(self.random)) || (!has(self.export) && !has(self.distributed)
                    && has(self.random)) || (!has(self.export) && !has(self.distributed) && !has(self.random))
                  message: only one pinning type should be set
              quota:
                description: Quota size of the Ceph Filesystem subvolume group.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                anyOf:
                - type: integer
                - type: string
                x-kubernetes-int-or-string: true
          status:
            description: Status represents the status of a CephFilesystem SubvolumeGroup
            type: object
            properties:
              info:
                type: object
                additionalProperties:
                  type: string
                nullable: true
              observedGeneration:
                description: ObservedGeneration is the latest generation observed by the controller.
                type: integer
                format: int64
              phase:
                description: ConditionType represent a resource's status
                type: string
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Filesystem
      type: string
      description: Name of the CephFileSystem
      jsonPath: .spec.filesystemName
    - name: Quota
      type: string
      jsonPath: .spec.quota
    - name: Pinning
      type: string
      priority: 1
      jsonPath: .status.info.pinning
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
  conversion:
    strategy: None
