apiVersion: v1
kind: Service
metadata:
  name: kubelet
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: prometheus-operator
    app.kubernetes.io/name: kubelet
    k8s-app: kubelet
spec:
  ports:
  - name: https-metrics
    protocol: TCP
    port: 10250
    targetPort: 10250
  - name: cadvisor
    protocol: TCP
    port: 4194
    targetPort: 4194
  - name: http-metrics
    protocol: TCP
    port: 10255
    targetPort: 10255
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
  - IPv4
  - IPv6
  ipFamilyPolicy: RequireDualStack
  internalTrafficPolicy: Cluster
