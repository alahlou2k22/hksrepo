apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system:controller:token-cleaner
  namespace: kube-system
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: 'true'
rules:
- verbs:
  - delete
  - get
  - list
  - watch
  apiGroups:
  - ''
  resources:
  - secrets
- verbs:
  - create
  - patch
  - update
  apiGroups:
  - ''
  - events.k8s.io
  resources:
  - events
