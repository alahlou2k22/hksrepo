apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: velero
  labels:
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: velero
    app.kubernetes.io/version: 1.18.2
    helm.sh/chart: velero-12.2.1
  annotations:
    deprecated.daemonset.template.generation: '1'
spec:
  selector:
    matchLabels:
      name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: velero
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: velero
        app.kubernetes.io/version: 1.18.2
        helm.sh/chart: velero-12.2.1
        name: node-agent
        role: node-agent
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '8085'
        prometheus.io/scrape: 'true'
    spec:
      volumes:
      - name: host-pods
        hostPath:
          path: /var/lib/kubelet/pods
          type: ''
      - name: host-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: ''
      - name: scratch
        emptyDir: {}
      containers:
      - name: node-agent
        image: docker.io/velero/velero:v1.18.4
        command:
        - /velero
        args:
        - node-agent
        - server
        ports:
        - name: http-monitoring
          containerPort: 8085
          protocol: TCP
        env:
        - name: VELERO_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: VELERO_SCRATCH_DIR
          value: /scratch
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: host-pods
          mountPath: /host_pods
          mountPropagation: HostToContainer
        - name: host-plugins
          mountPath: /host_plugins
          mountPropagation: HostToContainer
        - name: scratch
          mountPath: /scratch
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 3600
      dnsPolicy: ClusterFirst
      serviceAccountName: velero-server
      serviceAccount: velero-server
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
      schedulerName: default-scheduler
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 10
