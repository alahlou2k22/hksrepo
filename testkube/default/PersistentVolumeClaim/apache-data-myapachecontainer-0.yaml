apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apache-data-myapachecontainer-0
  namespace: default
  labels:
    instanceId: '35'
    instanceType: apachesberner
  finalizers:
  - kubernetes.io/pvc-protection
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: '1073741824'
  storageClassName: rook-ceph-block
  volumeMode: Filesystem
