apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 12.4.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: kube-prometheus
        app.kubernetes.io/version: 12.4.1
      annotations:
        checksum/grafana-config: f3697c98a79fc4a11c1d616d869584f4
        checksum/grafana-dashboardproviders: f4a0c73003700d26a752d804d0da0113
        checksum/grafana-datasources: 6c462174ecc02c2103eca46c6c60cdee
    spec:
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        secret:
          secretName: grafana-datasources
          defaultMode: 420
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
          defaultMode: 420
      - name: tmp-plugins
        emptyDir:
          medium: Memory
      - name: grafana-dashboard-alertmanager-overview
        configMap:
          name: grafana-dashboard-alertmanager-overview
          defaultMode: 420
      - name: grafana-dashboard-apiserver
        configMap:
          name: grafana-dashboard-apiserver
          defaultMode: 420
      - name: grafana-dashboard-cluster-total
        configMap:
          name: grafana-dashboard-cluster-total
          defaultMode: 420
      - name: grafana-dashboard-controller-manager
        configMap:
          name: grafana-dashboard-controller-manager
          defaultMode: 420
      - name: grafana-dashboard-grafana-overview
        configMap:
          name: grafana-dashboard-grafana-overview
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-cluster
        configMap:
          name: grafana-dashboard-k8s-resources-cluster
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-multicluster
        configMap:
          name: grafana-dashboard-k8s-resources-multicluster
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-namespace
        configMap:
          name: grafana-dashboard-k8s-resources-namespace
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-node
        configMap:
          name: grafana-dashboard-k8s-resources-node
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-pod
        configMap:
          name: grafana-dashboard-k8s-resources-pod
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-workload
        configMap:
          name: grafana-dashboard-k8s-resources-workload
          defaultMode: 420
      - name: grafana-dashboard-k8s-resources-workloads-namespace
        configMap:
          name: grafana-dashboard-k8s-resources-workloads-namespace
          defaultMode: 420
      - name: grafana-dashboard-kubelet
        configMap:
          name: grafana-dashboard-kubelet
          defaultMode: 420
      - name: grafana-dashboard-namespace-by-pod
        configMap:
          name: grafana-dashboard-namespace-by-pod
          defaultMode: 420
      - name: grafana-dashboard-namespace-by-workload
        configMap:
          name: grafana-dashboard-namespace-by-workload
          defaultMode: 420
      - name: grafana-dashboard-node-cluster-rsrc-use
        configMap:
          name: grafana-dashboard-node-cluster-rsrc-use
          defaultMode: 420
      - name: grafana-dashboard-node-rsrc-use
        configMap:
          name: grafana-dashboard-node-rsrc-use
          defaultMode: 420
      - name: grafana-dashboard-nodes-darwin
        configMap:
          name: grafana-dashboard-nodes-darwin
          defaultMode: 420
      - name: grafana-dashboard-nodes
        configMap:
          name: grafana-dashboard-nodes
          defaultMode: 420
      - name: grafana-dashboard-persistentvolumesusage
        configMap:
          name: grafana-dashboard-persistentvolumesusage
          defaultMode: 420
      - name: grafana-dashboard-pod-total
        configMap:
          name: grafana-dashboard-pod-total
          defaultMode: 420
      - name: grafana-dashboard-prometheus-remote-write
        configMap:
          name: grafana-dashboard-prometheus-remote-write
          defaultMode: 420
      - name: grafana-dashboard-prometheus
        configMap:
          name: grafana-dashboard-prometheus
          defaultMode: 420
      - name: grafana-dashboard-proxy
        configMap:
          name: grafana-dashboard-proxy
          defaultMode: 420
      - name: grafana-dashboard-scheduler
        configMap:
          name: grafana-dashboard-scheduler
          defaultMode: 420
      - name: grafana-dashboard-workload-total
        configMap:
          name: grafana-dashboard-workload-total
          defaultMode: 420
      - name: grafana-config
        secret:
          secretName: grafana-config
          defaultMode: 420
      containers:
      - name: grafana
        image: grafana/grafana:12.4.1
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: tmp-plugins
          mountPath: /tmp
        - name: grafana-dashboard-alertmanager-overview
          mountPath: /grafana-dashboard-definitions/0/alertmanager-overview
        - name: grafana-dashboard-apiserver
          mountPath: /grafana-dashboard-definitions/0/apiserver
        - name: grafana-dashboard-cluster-total
          mountPath: /grafana-dashboard-definitions/0/cluster-total
        - name: grafana-dashboard-controller-manager
          mountPath: /grafana-dashboard-definitions/0/controller-manager
        - name: grafana-dashboard-grafana-overview
          mountPath: /grafana-dashboard-definitions/0/grafana-overview
        - name: grafana-dashboard-k8s-resources-cluster
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-cluster
        - name: grafana-dashboard-k8s-resources-multicluster
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-multicluster
        - name: grafana-dashboard-k8s-resources-namespace
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-namespace
        - name: grafana-dashboard-k8s-resources-node
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-node
        - name: grafana-dashboard-k8s-resources-pod
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-pod
        - name: grafana-dashboard-k8s-resources-workload
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-workload
        - name: grafana-dashboard-k8s-resources-workloads-namespace
          mountPath: /grafana-dashboard-definitions/0/k8s-resources-workloads-namespace
        - name: grafana-dashboard-kubelet
          mountPath: /grafana-dashboard-definitions/0/kubelet
        - name: grafana-dashboard-namespace-by-pod
          mountPath: /grafana-dashboard-definitions/0/namespace-by-pod
        - name: grafana-dashboard-namespace-by-workload
          mountPath: /grafana-dashboard-definitions/0/namespace-by-workload
        - name: grafana-dashboard-node-cluster-rsrc-use
          mountPath: /grafana-dashboard-definitions/0/node-cluster-rsrc-use
        - name: grafana-dashboard-node-rsrc-use
          mountPath: /grafana-dashboard-definitions/0/node-rsrc-use
        - name: grafana-dashboard-nodes-darwin
          mountPath: /grafana-dashboard-definitions/0/nodes-darwin
        - name: grafana-dashboard-nodes
          mountPath: /grafana-dashboard-definitions/0/nodes
        - name: grafana-dashboard-persistentvolumesusage
          mountPath: /grafana-dashboard-definitions/0/persistentvolumesusage
        - name: grafana-dashboard-pod-total
          mountPath: /grafana-dashboard-definitions/0/pod-total
        - name: grafana-dashboard-prometheus-remote-write
          mountPath: /grafana-dashboard-definitions/0/prometheus-remote-write
        - name: grafana-dashboard-prometheus
          mountPath: /grafana-dashboard-definitions/0/prometheus
        - name: grafana-dashboard-proxy
          mountPath: /grafana-dashboard-definitions/0/proxy
        - name: grafana-dashboard-scheduler
          mountPath: /grafana-dashboard-definitions/0/scheduler
        - name: grafana-dashboard-workload-total
          mountPath: /grafana-dashboard-definitions/0/workload-total
        - name: grafana-config
          mountPath: /etc/grafana
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: grafana
      serviceAccount: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
      imagePullSecrets:
      - name: default-docker-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
