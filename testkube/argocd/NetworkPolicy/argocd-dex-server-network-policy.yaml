apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-dex-server-network-policy
  namespace: argocd
  labels:
    app.kubernetes.io/component: dex-server
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-dex-server
  ingress:
  - ports:
    - protocol: TCP
      port: 5556
    - protocol: TCP
      port: 5557
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
  - ports:
    - protocol: TCP
      port: 5558
    from:
    - namespaceSelector: {}
  policyTypes:
  - Ingress
