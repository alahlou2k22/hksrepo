apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-notifications-controller
  namespace: argocd
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
rules:
- verbs:
  - get
  - list
  - watch
  - update
  - patch
  apiGroups:
  - argoproj.io
  resources:
  - applications
  - appprojects
- verbs:
  - list
  - watch
  apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
- verbs:
  - get
  apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - argocd-notifications-cm
- verbs:
  - get
  apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - argocd-notifications-secret
