apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
rules:
- verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
  apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
- verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
  - patch
  apiGroups:
  - argoproj.io
  resources:
  - applications
  - appprojects
  - applicationsets
- verbs:
  - create
  - list
  apiGroups:
  - ''
  resources:
  - events
